<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 1; r: 1.5; }
        50%       { opacity: 0.2; r: 0.8; }
      }
      @keyframes twinkle2 {
        0%, 100% { opacity: 0.6; r: 1; }
        50%       { opacity: 0.05; r: 0.5; }
      }
      @keyframes twinkle3 {
        0%, 100% { opacity: 0.9; r: 2; }
        50%       { opacity: 0.3; r: 1; }
      }
      @keyframes shoot {
        0%   { opacity: 0;   transform: translate(0,0); }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0;   transform: translate(300px, 80px); }
      }
      @keyframes shoot2 {
        0%   { opacity: 0;   transform: translate(0,0); }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.8; }
        100% { opacity: 0;   transform: translate(250px, 70px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-6px); }
      }
      .s1 { animation: twinkle 2.1s ease-in-out infinite; }
      .s2 { animation: twinkle2 3.4s ease-in-out infinite; }
      .s3 { animation: twinkle3 1.8s ease-in-out infinite; }
      .s4 { animation: twinkle 4.2s ease-in-out infinite; }
      .s5 { animation: twinkle2 2.7s ease-in-out infinite; }
      .s6 { animation: twinkle3 5.1s ease-in-out infinite; }
      .sh1 { animation: shoot 6s ease-in-out infinite; animation-delay: 1s; }
      .sh2 { animation: shoot2 9s ease-in-out infinite; animation-delay: 4s; }
      .sh3 { animation: shoot 12s ease-in-out infinite; animation-delay: 7s; }
      .planet { animation: pulse 4s ease-in-out infinite; }
      .text-float { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)" rx="0"/>

  <!-- Nebula glow patches -->
  <ellipse cx="200" cy="110" rx="180" ry="80" fill="#1a1aff" opacity="0.04"/>
  <ellipse cx="800" cy="80" rx="200" ry="90" fill="#8a2be2" opacity="0.05"/>
  <ellipse cx="1050" cy="160" rx="130" ry="60" fill="#00bfff" opacity="0.04"/>

  <!-- Stars layer 1 (small, far) -->
  <circle class="s1" cx="23"   cy="14"  r="1"   fill="#ffffff" opacity="0.7"/>
  <circle class="s2" cx="67"   cy="38"  r="0.8" fill="#cce0ff" opacity="0.5"/>
  <circle class="s3" cx="112"  cy="8"   r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle class="s1" cx="155"  cy="55"  r="0.7" fill="#cce0ff" opacity="0.6"/>
  <circle class="s4" cx="198"  cy="20"  r="1"   fill="#ffffff" opacity="0.8"/>
  <circle class="s2" cx="234"  cy="72"  r="0.9" fill="#e0ccff" opacity="0.5"/>
  <circle class="s5" cx="278"  cy="15"  r="1.1" fill="#ffffff" opacity="0.9"/>
  <circle class="s3" cx="321"  cy="44"  r="0.8" fill="#cce0ff" opacity="0.7"/>
  <circle class="s1" cx="365"  cy="9"   r="1"   fill="#ffffff" opacity="0.8"/>
  <circle class="s6" cx="410"  cy="61"  r="1.2" fill="#e0ccff" opacity="0.6"/>
  <circle class="s2" cx="452"  cy="19"  r="0.7" fill="#ffffff" opacity="0.7"/>
  <circle class="s4" cx="498"  cy="38"  r="1"   fill="#cce0ff" opacity="0.5"/>
  <circle class="s5" cx="543"  cy="6"   r="0.9" fill="#ffffff" opacity="0.9"/>
  <circle class="s1" cx="589"  cy="52"  r="1.1" fill="#e0ccff" opacity="0.6"/>
  <circle class="s3" cx="632"  cy="22"  r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle class="s6" cx="676"  cy="68"  r="1"   fill="#cce0ff" opacity="0.7"/>
  <circle class="s2" cx="720"  cy="11"  r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle class="s4" cx="763"  cy="45"  r="0.7" fill="#e0ccff" opacity="0.5"/>
  <circle class="s1" cx="808"  cy="17"  r="1"   fill="#ffffff" opacity="0.8"/>
  <circle class="s5" cx="854"  cy="59"  r="0.9" fill="#cce0ff" opacity="0.6"/>
  <circle class="s3" cx="897"  cy="8"   r="1.1" fill="#ffffff" opacity="0.7"/>
  <circle class="s6" cx="942"  cy="36"  r="0.8" fill="#e0ccff" opacity="0.9"/>
  <circle class="s2" cx="986"  cy="14"  r="1"   fill="#ffffff" opacity="0.8"/>
  <circle class="s4" cx="1030" cy="52"  r="1.2" fill="#cce0ff" opacity="0.5"/>
  <circle class="s1" cx="1074" cy="21"  r="0.7" fill="#ffffff" opacity="0.9"/>
  <circle class="s5" cx="1118" cy="64"  r="1"   fill="#e0ccff" opacity="0.7"/>
  <circle class="s3" cx="1162" cy="10"  r="0.9" fill="#ffffff" opacity="0.8"/>

  <!-- Stars layer 2 (medium) -->
  <circle class="s4" cx="45"   cy="95"  r="1.5" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <circle class="s1" cx="133"  cy="130" r="1.2" fill="#aaddff" opacity="0.7"/>
  <circle class="s6" cx="210"  cy="88"  r="1.8" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <circle class="s2" cx="290"  cy="155" r="1"   fill="#ccbbff" opacity="0.6"/>
  <circle class="s5" cx="360"  cy="100" r="1.4" fill="#ffffff" opacity="0.8"/>
  <circle class="s3" cx="440"  cy="140" r="1.6" fill="#aaddff" opacity="0.7" filter="url(#glow)"/>
  <circle class="s1" cx="510"  cy="90"  r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle class="s4" cx="580"  cy="170" r="1"   fill="#ccbbff" opacity="0.5"/>
  <circle class="s6" cx="650"  cy="95"  r="1.7" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <circle class="s2" cx="730"  cy="150" r="1.3" fill="#aaddff" opacity="0.7"/>
  <circle class="s5" cx="800"  cy="85"  r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle class="s3" cx="870"  cy="145" r="1.1" fill="#ccbbff" opacity="0.6"/>
  <circle class="s1" cx="950"  cy="100" r="1.8" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <circle class="s4" cx="1020" cy="160" r="1.2" fill="#aaddff" opacity="0.7"/>
  <circle class="s6" cx="1095" cy="95"  r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle class="s2" cx="1170" cy="140" r="1"   fill="#ccbbff" opacity="0.5"/>

  <!-- Stars layer 3 (close, bright) -->
  <circle class="s3" cx="80"   cy="180" r="2"   fill="#ffffff" opacity="0.9" filter="url(#glow-strong)"/>
  <circle class="s1" cx="250"  cy="195" r="1.8" fill="#88ccff" opacity="0.8" filter="url(#glow)"/>
  <circle class="s5" cx="470"  cy="200" r="2.2" fill="#ffffff" opacity="0.9" filter="url(#glow-strong)"/>
  <circle class="s2" cx="700"  cy="185" r="1.9" fill="#bb99ff" opacity="0.8" filter="url(#glow)"/>
  <circle class="s4" cx="910"  cy="195" r="2"   fill="#ffffff" opacity="0.9" filter="url(#glow-strong)"/>
  <circle class="s6" cx="1100" cy="175" r="1.7" fill="#88ccff" opacity="0.7" filter="url(#glow)"/>

  <!-- Distant planets -->
  <circle class="planet" cx="1140" cy="35" r="14" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="1140" cy="35" r="13" fill="none" stroke="#4488bb" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="1140" cy="35" rx="20" ry="5" fill="none" stroke="#4488bb" stroke-width="1" opacity="0.3"/>

  <circle class="planet" cx="60"  cy="55" r="8"  fill="#2a1a3e" opacity="0.7"/>
  <circle cx="60" cy="55" r="7" fill="none" stroke="#8844bb" stroke-width="1" opacity="0.4"/>

  <!-- Shooting stars -->
  <g class="sh1" transform="translate(100, 30)">
    <line x1="0" y1="0" x2="-40" y2="-10" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.5" fill="white"/>
  </g>
  <g class="sh2" transform="translate(500, 10)">
    <line x1="0" y1="0" x2="-35" y2="-9" stroke="#aaddff" stroke-width="1.2" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.2" fill="#aaddff"/>
  </g>
  <g class="sh3" transform="translate(850, 20)">
    <line x1="0" y1="0" x2="-50" y2="-12" stroke="white" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="1" fill="white"/>
  </g>

  <!-- Center text overlay -->
  <text x="600" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="bold" fill="white" opacity="0.92" class="text-float" filter="url(#glow-strong)">Akash Kushwaha</text>
  <text x="600" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#6AD3F7" opacity="0.85" letter-spacing="3">FULL STACK DEVELOPER</text>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#fade)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="260">
  <defs>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="hud-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
    <filter id="neon">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.4"/>
    </filter>
    <style>
      @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
      .p-dot { animation: pulse-dot 2s ease-in-out infinite; transform-origin: center; }
      .hud-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="828" height="248" rx="16" fill="url(#hud-bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="10" y="10" width="820" height="240" rx="12" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4 6"/>

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 824 32 L 824 16 L 808 16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 16 228 L 16 244 L 32 244" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 824 228 L 824 244 L 808 244" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Top Status Bar -->
  <circle cx="36" cy="36" r="4.5" fill="#10b981" class="p-dot"/>
  <text x="50" y="40" class="hud-text" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">SYSTEM TELEMETRY // AKASH KUSHWAHA</text>
  <text x="804" y="40" text-anchor="end" class="hud-text" font-size="11" fill="#64748b">STATUS: ACTIVE • READY_TO_DEPLOY</text>
  <line x1="26" y1="52" x2="814" y2="52" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Column 1: Core Metrics (Left) -->
  <text x="36" y="80" class="hud-text" font-size="12" font-weight="bold" fill="#f1f5f9">CORE ARCHITECTURE CALIBRATION</text>

  <!-- Bar 1: Backend & APIs -->
  <text x="36" y="104" class="hud-text" font-size="11" fill="#94a3b8">ASP.NET Core • Web API • C# • Node.js</text>
  <text x="440" y="104" text-anchor="end" class="hud-text" font-size="11" font-weight="bold" fill="#38bdf8">95%</text>
  <rect x="36" y="112" width="404" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="36" y="112" width="384" height="7" rx="3.5" fill="url(#bar-cyan)" filter="url(#hud-glow)"/>

  <!-- Bar 2: Frontend SPAs -->
  <text x="36" y="140" class="hud-text" font-size="11" fill="#94a3b8">React.js • Angular • TypeScript</text>
  <text x="440" y="140" text-anchor="end" class="hud-text" font-size="11" font-weight="bold" fill="#c084fc">88%</text>
  <rect x="36" y="148" width="404" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="36" y="148" width="355" height="7" rx="3.5" fill="url(#bar-purple)" filter="url(#neon)"/>

  <!-- Bar 3: Database & Caching -->
  <text x="36" y="176" class="hud-text" font-size="11" fill="#94a3b8">SQL Server • MongoDB • Redis Caching</text>
  <text x="440" y="176" text-anchor="end" class="hud-text" font-size="11" font-weight="bold" fill="#34d399">92%</text>
  <rect x="36" y="184" width="404" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="36" y="184" width="371" height="7" rx="3.5" fill="url(#bar-green)"/>

  <!-- Bar 4: DevOps & Cloud -->
  <text x="36" y="212" class="hud-text" font-size="11" fill="#94a3b8">Docker • Microsoft Azure • IIS • Git</text>
  <text x="440" y="212" text-anchor="end" class="hud-text" font-size="11" font-weight="bold" fill="#fbbf24">84%</text>
  <rect x="36" y="220" width="404" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="36" y="220" width="339" height="7" rx="3.5" fill="url(#bar-amber)"/>

  <!-- Vertical Divider -->
  <line x1="480" y1="68" x2="480" y2="236" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- Column 2: System Spec & Telemetry (Right) -->
  <text x="510" y="80" class="hud-text" font-size="12" font-weight="bold" fill="#f1f5f9">ENGINEERING SPECS</text>

  <!-- Spec Box 1 -->
  <rect x="510" y="94" width="140" height="60" rx="8" fill="#141a29" stroke="#1e293b"/>
  <text x="522" y="112" class="hud-text" font-size="10" fill="#64748b">EXPERIENCE</text>
  <text x="522" y="136" class="hud-text" font-size="18" font-weight="bold" fill="#38bdf8">1.5+ YRS</text>
  <text x="522" y="148" class="hud-text" font-size="9" fill="#10b981">● In Production</text>

  <!-- Spec Box 2 -->
  <rect x="664" y="94" width="140" height="60" rx="8" fill="#141a29" stroke="#1e293b"/>
  <text x="676" y="112" class="hud-text" font-size="10" fill="#64748b">CORE STACK</text>
  <text x="676" y="136" class="hud-text" font-size="18" font-weight="bold" fill="#c084fc">FULL-STACK</text>
  <text x="676" y="148" class="hud-text" font-size="9" fill="#38bdf8">● .NET + React</text>

  <!-- Spec Box 3 -->
  <rect x="510" y="164" width="140" height="64" rx="8" fill="#141a29" stroke="#1e293b"/>
  <text x="522" y="182" class="hud-text" font-size="10" fill="#64748b">ARCHITECTURE</text>
  <text x="522" y="202" class="hud-text" font-size="13" font-weight="bold" fill="#34d399">REST / CQRS</text>
  <text x="522" y="218" class="hud-text" font-size="9" fill="#94a3b8">Clean Architecture</text>

  <!-- Spec Box 4 -->
  <rect x="664" y="164" width="140" height="64" rx="8" fill="#141a29" stroke="#1e293b"/>
  <text x="676" y="182" class="hud-text" font-size="10" fill="#64748b">DEVELOPER MOTTO</text>
  <text x="676" y="202" class="hud-text" font-size="13" font-weight="bold" fill="#f43f5e">BUILD &amp; SCALE</text>
  <text x="676" y="218" class="hud-text" font-size="9" fill="#fbbf24">Repeat 🚀</text>
</svg>
